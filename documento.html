<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101828">
<title>Documento — Condomínio Casa Grande</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#eef2f7;color:#172033}
body{display:flex;flex-direction:column;min-height:100vh}
.toolbar{position:relative;z-index:2;display:flex;align-items:center;gap:16px;padding:12px 18px;background:#101828;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.16)}
.back{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:10px 16px;border-radius:10px;background:#fff;color:#101828;text-decoration:none;font-weight:700;white-space:nowrap}
.back:hover{background:#e8eef8}
.doc-title{font-size:15px;font-weight:700;line-height:1.3}
.viewer{flex:1;min-height:0;width:100%;border:0;background:#dce3ec}
@media(max-width:600px){.toolbar{padding:10px;gap:10px}.back{padding:10px 12px;font-size:14px}.doc-title{font-size:13px}}
</style>
</head>
<body>
<header class="toolbar">
<a class="back" href="https://dashboardsaldodevedor.vercel.app/">← Voltar ao Dashboard</a>
<div class="doc-title" id="docTitle">Documento do Condomínio Casa Grande</div>
</header>
<iframe class="viewer" id="pdfViewer" title="Documento em PDF"></iframe>
<script>
const documents = {
  convencao: { title: "Convenção do Condomínio Casa Grande — 1979", file: "/convencao-casa-grande.pdf" },
  garagem: { title: "Regulamento da Garagem — 1973", file: "/Regulamento_Garagem_Casa_Grande_1973.pdf" }
};
const key = new URLSearchParams(location.search).get("arquivo");
const doc = documents[key];
if (!doc) {
  document.getElementById("docTitle").textContent = "Documento não encontrado";
  document.getElementById("pdfViewer").remove();
} else {
  document.title = doc.title;
  document.getElementById("docTitle").textContent = doc.title;
  document.getElementById("pdfViewer").src = doc.file + "#view=FitH";
}
</script>
</body>
</html>
